name: Build CSD v0.2.11 R7 ZPatch Final

on:
  push:
    branches:
      - csd-build-v0211-r7-zpatch-final
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Match verified R7 Build ID
        run: python -c "from pathlib import Path; p=Path(r'CrescentSetupDirectorV0211R7ZPatchFinal/ci_build.py'); s=p.read_text(encoding='utf-8'); old='CSD_V0211_API15_NET10_CE_BELL_GATE_SUPPORT_PRIORITY_R7_20260828'; new='CSD_V0211_API15_NET10_ALL_REPORTED_BUGFIX_R7_20260828'; assert old in s; p.write_text(s.replace(old,new), encoding='utf-8')"

      - name: Build and verify CSD R7
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: nananachch/test
        run: python .\CrescentSetupDirectorV0211R7ZPatchFinal\ci_build.py

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSD-v0.2.11-R7-zpatch-final-verified
          path: CrescentSetupDirectorV0211R7ZPatchFinal/build-artifact
          if-no-files-found: error
