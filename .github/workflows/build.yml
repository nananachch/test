name: Build Dalamud plugin

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'repo/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        shell: pwsh
        run: dotnet build .\DiademRouteHelper\DiademRouteHelper.csproj --configuration Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\repo | Out-Null
          $output = '.\DiademRouteHelper\bin\x64\Release\DiademRouteHelper'
          if (!(Test-Path $output)) { throw "Build output not found: $output" }
          Compress-Archive -Path "$output\*" -DestinationPath .\repo\DiademRouteHelper.zip -Force

      - name: Publish package
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/DiademRouteHelper.zip
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Build plugin package"
          git push
