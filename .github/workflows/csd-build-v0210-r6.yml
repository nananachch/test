name: Build CSD v0.2.10 R6

on:
  push:
    branches:
      - csd-build-v0210-r6-ce-burst
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and verify CSD R6
        run: python .\CrescentSetupDirectorV0210R6\ci_build_v0210_r6_chunks.py

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSD-v0.2.10-R6-verified
          path: CrescentSetupDirectorV0210R6/build-artifact
          if-no-files-found: error
