name: Build Crescent Setup Director v0.2.4 Final

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'CrescentSetupDirectorV024Final/**'
      - '.github/workflows/csd-build-v024-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build and verify
        shell: cmd
        run: python CrescentSetupDirectorV024Final\ci_build_v024.py

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSD-v0.2.4-verified
          path: CrescentSetupDirectorV024Final/build-artifact
          if-no-files-found: error
          retention-days: 7
