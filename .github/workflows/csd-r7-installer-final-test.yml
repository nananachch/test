name: CSD R7 final exact installer Windows tests

on:
  push:
    branches: [ csd-r7-build-20260828 ]
    paths:
      - 'csd-r7-installer-final/**'
      - '.github/workflows/csd-r7-installer-final-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify exact text parts and reassemble
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @{
            'csd-r7-installer-final/installer-parts/part01.txt'='36c47280c4d9a245b87da6c97c8bda4c1025fa2483e729aa7f0868aed119ee70'
            'csd-r7-installer-final/installer-parts/part02.txt'='94fb5d93347989dc658375bd9d134296f593ca6799c6cd09e6fca4dbc97c2f9e'
            'csd-r7-installer-final/installer-parts/part03.txt'='209aaacd633035e851e3872d1416eb027948accd659339acc9d518724bfd7642'
            'csd-r7-installer-final/installer-parts/part04.txt'='cb67adef48f1db0cc34ec603ba5f76e0322ef4185f41eecc5f14dc156bc1ee30'
            'csd-r7-installer-final/harness-parts/part01.txt'='8d5527a14a3dc2587ee081116ee7e394eaca775a643c5fc3575836eb260ef2b2'
            'csd-r7-installer-final/harness-parts/part02.txt'='076f6d9ac5f9da2b5a0d0d8b2c5f0d439579e0a41aa59e941b1fb878edfc110f'
          }
          foreach ($item in $checks.GetEnumerator()) {
            $actual=(Get-FileHash $item.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$($item.Key)=$actual"
            if ($actual -ne $item.Value) { throw "Part SHA mismatch: $($item.Key)" }
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $installerParts = 1..4 | ForEach-Object { "csd-r7-installer-final/installer-parts/part{0:D2}.txt" -f $_ }
          $installerText = ($installerParts | ForEach-Object { [IO.File]::ReadAllText($_, [Text.Encoding]::UTF8) }) -join ''
          [IO.File]::WriteAllText('csd-r7-installer-final/install_or_update_codex_project.py', $installerText, $utf8NoBom)
          $harnessParts = 1..2 | ForEach-Object { "csd-r7-installer-final/harness-parts/part{0:D2}.txt" -f $_ }
          $harnessText = ($harnessParts | ForEach-Object { [IO.File]::ReadAllText($_, [Text.Encoding]::UTF8) }) -join ''
          [IO.File]::WriteAllText('csd-r7-installer-final/windows_installer_harness.py', $harnessText, $utf8NoBom)
          $installerSha=(Get-FileHash 'csd-r7-installer-final/install_or_update_codex_project.py' -Algorithm SHA256).Hash.ToLowerInvariant()
          $harnessSha=(Get-FileHash 'csd-r7-installer-final/windows_installer_harness.py' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "INSTALLER_SHA256=$installerSha"
          Write-Host "HARNESS_SHA256=$harnessSha"
          if ($installerSha -ne '286ce4905f1101d3bf56b0e911c9c07e76520a6a54764b53ad38a75316324375') { throw 'Installer final SHA mismatch' }
          if ($harnessSha -ne 'dd165aaa0da43b8c8df77f50ae1d1b20f43c3b9324c66148f63b1573ee35ace8') { throw 'Harness final SHA mismatch' }

      - name: Run exact installer scenarios on Windows
        run: python csd-r7-installer-final/windows_installer_harness.py

      - name: Upload Windows installer proof
        uses: actions/upload-artifact@v4
        with:
          name: csd-r7-windows-installer-proof
          path: csd-r7-installer-final/windows-installer-proof.txt
          if-no-files-found: error
          retention-days: 2
